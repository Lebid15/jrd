# ============================================================
# JRD — فحص البناء (CI)
# ------------------------------------------------------------
# يبني الـ frontend ويفحص صيغة ملفات JS عند كل Pull Request إلى main،
# لالتقاط الكود المكسور قبل الدمج. النشر يتم تلقائياً على الخادم عبر
# cron (deploy/auto-deploy.sh) — لا علاقة له بهذا الملف.
# ============================================================
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build frontend (يكشف كسر البناء قبل الدمج)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Syntax-check backend / bot / scrapers
        run: |
          set -e
          npm ci --prefix backend --ignore-scripts
          FILES=$(find backend/src bot/src messages-scraper/src scraper -name '*.js' 2>/dev/null)
          for f in $FILES; do
            node --check "$f"
          done
          echo "✓ فحص الصيغة نجح لكل ملفات JS"
